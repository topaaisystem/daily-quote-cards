name: daily-quote

on:
  schedule:
    # GitHub 예약 실행은 수 시간 늦어질 수 있어(2026-11-10에 5시간 지연 확인) 일찍 시작해 08:30(KST)까지 대기하고,
    # 뒤쪽 두 줄은 예비입니다. 이미 발송된 날은 자동으로 건너뜁니다.
    - cron: '17 22 * * *'        # UTC 22:17 = KST 07:17 (주 실행, 08:30까지 대기 후 발송)
    - cron: '7 23 * * *'         # UTC 23:07 = KST 08:07 (예비)
    - cron: '7 0 * * *'          # UTC 00:07 = KST 09:07 (예비)
  workflow_dispatch:
    inputs:
      send:
        description: '카카오톡으로 실제 발송 (true/false)'
        default: 'false'

permissions:
  contents: write

concurrency:
  group: daily-quote
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      QUOTE_HISTORY: data/history.json
      CI_COMMIT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Offline tests
        run: python -X utf8 -m unittest -q
      - name: Make card
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}   # 없으면 MyMemory 무료 번역으로 자동 대체
        run: python -X utf8 free_pipeline.py make --publish
      - name: Publish card to Pages
        run: |
          git config user.name daily-quote-bot
          git config user.email daily-quote-bot@users.noreply.github.com
          git add cards
          git diff --cached --quiet || { git commit -m "card $(date -u +%F-%H%M)"; git pull --rebase -q; git push -q; }
      - name: Send to KakaoTalk
        if: github.event_name == 'schedule' || github.event.inputs.send == 'true'
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          SEND_AT: ${{ github.event_name == 'schedule' && '08:30' || '' }}   # 수동 실행은 즉시 발송
        run: python -X utf8 kakao_send.py
